# Reverse proxy Nginx untuk apajurusanku (akses lewat IP publik / domain).
# Salin ke /etc/nginx/sites-available/apajurusanku lalu aktifkan:
#   sudo ln -s /etc/nginx/sites-available/apajurusanku /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Ganti /var/www/apajurusanku dengan lokasi proyek di server Anda.
server {
    listen 80;
    server_name _;                      # ganti dengan domain bila ada

    client_max_body_size 2m;            # batas unggah gambar maskot (aplikasi membatasi 1 MB)

    # --- Frontend statis (lebih cepat disajikan langsung oleh Nginx) ---
    root /var/www/apajurusanku/frontend/public;
    index index.html;

    location /src/ {
        alias /var/www/apajurusanku/frontend/src/;
        expires 1h;
    }

    # --- API & gambar unggahan diteruskan ke Node.js ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /unggahan/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
